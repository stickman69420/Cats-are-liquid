			function areaFromCoords(coordArray) {
				var x = coordArray,
				a = 0;
				
				// Must have even number of elements
				if (x.length % 2) return;
				
				// Process pairs, increment by 2 and stop at length - 2
				for (var i=0, iLen=x.length-2; i<iLen; i+=2) {
					a += x[i]*x[i+3] - x[i+2]*x[i+1];
				}
				return Math.abs(a/2);
			}

			function genBoxImg(box,e) {
				ctx.clearRect(0,0,canvas.width,canvas.height)
				const vert = e.h > e.w
				const small = e.small ?? Math.min(e.h,e.w)
				const res = small/32
				canvas.height = e.h/res
				canvas.width = e.w/res
				for (let i=0;i<e.w/small;i++) {
					for (let j=0;j<e.h/small;j++) {
						ctx.drawImage(tileImgs[e.img],i*small/res,j*small/res,small/res,small/res)
					}
				}
				ctx.fillStyle = e.tint ?? "#0000"
				ctx.fillRect(0,0,canvas.width,canvas.height)
				box.render.sprite.texture = canvas.toDataURL()
				box.render.sprite.xScale = res
				box.render.sprite.yScale = res
				return canvas.toDataURL()
			}

									Composite.remove(engine.world,e)
									eaten++
									if (eaten == maxeat) {
										localStorage.setItem("lev"+level+"c",true)
										setTimeout(() => {
											window.location = "./levelSelect.html"
										},2000)
									}
									e.uran = false
								}
							}
						}
					})
					//if (e.oData == undefined) alert(JSON.stringify(Object.keys(e)))
					if (!e.particle && e.oData.type == 6.5 && engine.timing.timestamp-e.press > e.oData.release) {
						e.oData.img = e.oData.img.slice(0,-8)
						e.oData.type = 6
						genBoxImg(e,e.oData)
						e.oData.hide.forEach((r) => {
							map[r].collisionFilter.mask =  0x1111
							map[r].render.visible = true
						})
						e.oData.show.forEach((r) => {
							map[r].collisionFilter.mask =  0x0000
							map[r].render.visible = false
						})
					}
				})
				
				for (let i=particles.length-1;i>=0;i--) {
					let e = particles[i]
					e.maxLife -= t.delta
					if (e.maxLife < 0) {
						Composite.remove(engine.world,e)
						particles.splice(i,1)
						switch ((e.oData ?? {}).type) {
							case 1:
								explo.push({"x":e.position.x,"y":e.position.y,"size":e.oData.range*2,"start":engine.timing.timestamp})
								Composite.allBodies(engine.world).filter(b => b.collisionFilter.mask != 0x0000).forEach((r) => {
									//const dist = Math.hypot(r.position.x-e.position.x,r.position.y-e.position.y)
									const bounds = r.bounds
									const off = [Math.max(bounds.min.x-e.position.x,e.position.x-bounds.max.x,0),Math.max(bounds.min.y-e.position.y,e.position.y-bounds.max.y,0)]
									const dist = Math.hypot(...off)
									if (dist <= e.oData.range) {
										const force = e.oData.maxForce/(0+(dist/50)**2)
										const ang = Math.atan2(r.position.y-e.position.y,r.position.x-e.position.x)
										Body.applyForce(r,r.position,{"x":force*Math.cos(ang),"y":force*Math.sin(ang)})

								})
								break;
						}
					}
				}

				})
				
				Body.applyForce(player.eyes,player.eyes.position,{"x":controls[0].value+controls[1].value,"y":controls[2].value*Math.max(colcount[0],Math.min(colcount[1],colcount[3])/3)+controls[3].value})
				
				Body.applyForce(player.eyes, player.eyes.position, {x: -gravity.x * gravity.scale * player.eyes.mass,y: -gravity.y * gravity.scale * player.eyes.mass});

				controls[5].time -= t.delta
				uran.forEach((e) => {
					let force = 0
					const coll = Query.collides(e,player.body)
					coll.forEach((r) => {
						force += r.depth
					})
					//f = force
					if (force > 6) {
						if (e.oData.type == 2) {
							e.oData.type = 2.1
							e.oData.img = "uranium broken"
							genBoxImg(e,e.oData)
							for (let i=0;i<e.uranPel*3;i++) {
								let part = Bodies.circle(e.position.x+(Math.random()-0.5)*e.oData.w,e.position.y+(Math.random()-0.5)*e.oData.h,5,{
									"render": {
										"fillStyle": "#0FF7"
									},
									"collisionFilter": {
										"mask": 0x0001
									}
								})
								const ang = Math.random()*Math.PI*2
								Body.setVelocity(part,{"x":Math.cos(ang)*5,"y":Math.sin(ang)*5})
								Composite.add(engine.world,part)
								part.maxLife = 1000+Math.random()*2000
								part.particle = true
								particles.push(part)
							}
						} else if (e.oData.type == 2.2) {
							e.oData.type = 0
							e.oData.img = "uranium empty"
							genBoxImg(e,e.oData)
							for (let i=0;i<e.uranPel;i++) {
								let part = Bodies.circle(e.position.x+(Math.random()-0.5)*e.oData.w,e.position.y+(Math.random()-0.5)*e.oData.h,5,{
									"render": {
										"fillStyle": Math.random() < 0.5 ? "#9F0" : "#676767"
									},
									"collisionFilter": {
										"mask": 0x0001
									}
								})
								part.uran = true
								const ang = Math.random()*Math.PI*2
								Body.setVelocity(part,{"x":3*Math.cos(ang),"y":3*Math.sin(ang)})
								Composite.add(engine.world,part)
							}
							e.collisionFilter.mask = 0x0000
						} 
					} else if (force < 2 && e.oData.type == 2.1) e.oData.type = 2.2
				})
				breaka.forEach((e) => {
					let force = 0
					let force2 = {"x":0,"y":0}
					const coll = Query.collides(e,player.body)
					coll.forEach((r) => {
						force += r.depth
						force2.x += r.penetration.x
						force2.y += r.penetration.y
					})
					force += Math.hypot(...Object.values(e.force))
					force2.x += e.force.x
					force2.y += e.force.y
					//if (Math.hypot(...Object.values(force2)) > 0) alert(JSON.stringify(force2))
					//force2 = Vector.mult(Vector.div(force2,force),force-e.oData.strength)
					//if (Math.hypot(...Object.values(force2)) > 0) alert(JSON.stringify(force2))
					if (force > e.oData.strength) {
						const pcount = (e.oData.w*e.oData.h)/((e.oData.small ?? Math.min(e.oData.h,e.oData.w))**2)*30
						//if (Math.hypot(...Object.values(force2)) > 0) alert(JSON.stringify(Vector.div(force2,pcount)))
						for (let i=0;i<pcount;i++) {
							ctx.width = 32
							ctx.height = 32
							ctx.clearRect(0,0,32,32)
							ctx.drawImage(tileImgs[e.oData.img],0,0,32,32)
							const pxdata = ctx.getImageData(Math.floor(Math.random()*32),Math.floor(Math.random()*32),1,1).data
							let part = Bodies.circle(e.position.x+(Math.random()-0.5)*e.oData.w,e.position.y+(Math.random()-0.5)*e.oData.h,5,{
								"render": {
									"fillStyle": "rgba("+pxdata[0]+","+pxdata[1]+","+pxdata[2]+","+pxdata[3]/255+")"
								},
								"collisionFilter": {
									"mask": 0x0001
								}
							})
							const ang = Math.random()*Math.PI*2
							Body.setVelocity(part,Vector.add({"x":Math.cos(ang)*5,"y":Math.sin(ang)*5},Vector.div(force2,pcount)))
							Composite.add(engine.world,part)
							part.maxLife = 1000+Math.random()*2000
							part.particle = true
							particles.push(part)
						}
						Composite.remove(engine.world,e)
						e.dead = true
					}
				})
				let dpa
				while (1+(dpa = breaka.findIndex(p => p.dead))) {
					breaka.splice(dpa,1)
				}
				/*render.context.font = "20px Arial"
				player.body.forEach((e,ee) => {
					let wall = player.bodyWalls[ee]
					let r = player.body[(ee+1)%player.body.length]
					Body.setPosition(wall,{"x":(e.position.x+r.position.x)/2,"y":(e.position.y+r.position.y)/2})
					Body.setAngle(wall,0)
					const size = Math.hypot(e.position.x-r.position.x,e.position.y-r.position.y)
					Body.scale(wall, size/wall.scale, 1)
					//render.context.fillText((size/wall.scale)+","+size,400,10+ee*25)
					wall.scale = size
					Body.setAngle(wall,Math.atan2(e.position.y-r.position.y,e.position.x-r.position.x))
					Body.setAngularVelocity(wall,0)
					//Body.applyForce(wall, wall.position, {x: -gravity.x * gravity.scale * wall.mass,y: -gravity.y * gravity.scale * wall.mass});
					Body.setVelocity(wall,e.velocity)
					let wall2 = player.bodyWalls2[ee]
					let r2 = player.body[((ee-1)+player.body.length)%player.body.length]
					Body.setPosition(wall,e.position)
					Body.setAngle(wall,0)
					const size2 = Math.hypot(r2.position.x-r.position.x,r2.position.y-r.position.y)
					Body.scale(wall, size2/wall.scale, 1)
					wall.scale = size2
					Body.setAngle(wall,Math.atan2(r2.position.y-r.position.y,r2.position.x-r.position.x))
					Body.setAngularVelocity(wall,0)
					Body.setVelocity(wall,e.velocity)
				})*/
			})
			Matter.Events.on(render, "beforeRender", (t,o,n) => {
				/*manDraw.forEach((e) => {
					let bound = e.body.bounds
					e.draw = bound.min.x <= camBounds.max.x && bound.max.x >= camBounds.min.x && bound.min.y <= camBounds.max.y && bound.max.y >= camBounds.min.y
				})
				terDraw.forEach((e) => {
					e.draw = e.x <= camBounds.max.x && e.x+e.img.width >= camBounds.min.x && e.y <= camBounds.max.y && e.y+e.img.height >= camBounds.min.y
				})*/
				player.x = average(player.body.map(b => b.position.x))
				player.y = average(player.body.map(b => b.position.y))
				Matter.Bounds.shift(camBounds, {"x":player.x-496,"y":player.y-286})
				render.canvas.style.width = Math.min(100,(100/(render.canvas.height/render.canvas.width))*(window.innerHeight/window.innerWidth))+"%";
			})
			Matter.Events.on(render, "afterRender", (t,o,n) => {
				render.context.lineWidth = 1
				render.context.setTransform(2,0,0,2,0,0)
				render.context.fillStyle = "#FFF7"
				particles2.forEach((e,ee) => {
					render.context.beginPath()
					render.context.arc(e[0]-camBounds.min.x,e[1]-camBounds.min.y,2,Math.PI*2,0)
					render.context.fill()
					e[0] += e[2].force.x*500
					e[1] += e[2].force.y*500
					if (e[0] < e[2].x || e[0] > e[2].x+e[2].w || e[1] < e[2].y || e[1] > e[2].y+e[2].h) e.dead = true
				})
				let dpa
				while (1+(dpa = particles2.findIndex(p => p.dead))) {
					particles2.splice(dpa,1)
				}
				render.context.fillStyle = "#000"
				render.context.textAlign = "center"
				render.context.textBaseline = "middle"
				mapJSON.filter(o => o.type == 1).forEach((e) => {
					if (e.visible ?? true) {
						render.context.font = e.size+"px Arial"
						render.context.fillText(e.text,e.x-camBounds.min.x,e.y-camBounds.min.y)
					} else {
						if (Math.hypot(e.x-player.x,e.y-player.y) <= e.range) {
							setTimeout((r) => {
								r.visible = true
							},(e.delay ?? 0),e)
						}
					}
				})
				
				render.context.beginPath()
				render.context.moveTo(player.body[0].position.x-camBounds.min.x,player.body[0].position.y-camBounds.min.y)
				player.body.toReversed().forEach((e) => {
					render.context.lineTo(e.position.x-camBounds.min.x,e.position.y-camBounds.min.y)
				})
				render.context.fill()
				
				for (let i=-12.5;i<=12.5;i+=25) {
					render.context.beginPath();
					render.context.arc(player.eyes.position.x+i*Math.cos(player.eyes.angle)-camBounds.min.x, player.eyes.position.y+i*Math.sin(player.eyes.angle)-camBounds.min.y, 7, 0, Math.PI * 2);
					render.context.fillStyle = '#000';
					render.context.fill();
					render.context.strokeStyle = '#FF0';
					render.context.stroke();
				}
				
				if (controls[5].time >= 0) {
					render.context.fillStyle = '#F77'
					render.context.beginPath()
					render.context.save()
					render.context.translate(player.eyes.position.x-camBounds.min.x,player.eyes.position.y-camBounds.min.y)
					render.context.rotate(player.eyes.angle)
					render.context.translate(0,5)
					render.context.moveTo(-5,0)
					render.context.lineTo(5,0)
					render.context.scale(1,Math.max(2*Math.sin(controls[5].time/controls[5].max*Math.PI),0))
					render.context.arc(0,0,5,0,Math.PI)
					render.context.restore();
					render.context.fill()
				}
				
				render.context.lineWidth = 3
				
				/*render.context.beginPath();
				render.context.moveTo(100, 200);
				render.context.bezierCurveTo(150, 120, 250, 120, 300, 200);
				render.context.bezierCurveTo(250, 280, 150, 280, 100, 200);
				render.context.fillStyle = '#FFFFFF';
				render.context.fill();
				//render.context.lineWidth = 4;
				//render.context.strokeStyle = '#000000';
				//render.context.stroke();
				
				render.context.beginPath();
				render.context.arc(200, 200, 60, 0, Math.PI * 2);
				render.context.fillStyle = '#FF0';
				render.context.fill();
				//render.context.stroke();
				
				render.context.beginPath();
				render.context.arc(200, 200, 55, 0, Math.PI * 2);
				render.context.fillStyle = '#000000';
				render.context.fill();*/
				
				for (let i=explo.length-1;i>=0;i--) {
					let e = explo[i]
					if (engine.timing.timestamp-e.start > 19000/60) explo.splice(i,1)
					else render.context.drawImage(imgs.explosion,Math.floor((engine.timing.timestamp-e.start)/(19000/60)*(640/32))*32,0,32,32,e.x-e.size/2-camBounds.min.x,e.y-e.size/2-camBounds.min.y,e.size,e.size)
				}
				
				render.context.setTransform(1,0,0,1,0,0)
				
				controls.filter(c => c.visible ?? true).forEach((e) => {
					render.context.fillStyle = e.bgcol
					render.context.strokeStyle = e.bcol
					render.context.fillRect(e.x,e.y,e.w,e.h)
					render.context.strokeRect(e.x,e.y,e.w,e.h)
					render.context.fillStyle = e.col
					if (e.text) {
						render.context.font = "100px arial"
						render.context.font = Math.min(100*e.w/render.context.measureText(e.text).width,e.h)+"px arial"
						render.context.fillText(e.text,e.x+e.w/2,e.y+e.h/2)
					} else if (e.fill != undefined) {
						render.context.fillRect(e.x,e.y+e.h*(1-e.fill),e.w,e.h*e.fill)
					} else if (e.img) {
						if (e.Img.complete) render.context.drawImage(e.Img,e.x,e.y,e.w,e.h)
					}
				})
				render.context.fillStyle = "#000"
				render.context.font = "50px arial"
				render.context.textAlign = "left"
				render.context.fillText("Eaten: "+eaten+"/"+maxeat,10,35)
				render.context.fillText(Math.round(100*gameLoop())/100+" fps",10,85)
				//render.context.fillText(JSON.stringify(buh),400,300)
				if (eaten == maxeat) {
					render.context.fillStyle = "#0F0"
					render.context.font = "150px arial"
					render.context.textAlign = "center"
					render.context.fillText("You did the level",960,540)
				}
				render.context.fillStyle = "#000"
				render.context.font = "20px arial"
				//render.context.fillText(JSON.stringify(Composite.allBodies(engine.world).filter(b => b != player.eyes && !player.body.includes(b) && b.collisionFilter.mask != 0x0000).map(o => o.oData)),960,540)
			})
